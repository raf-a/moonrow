name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The newest Xcode on the image, unless the XCODE_APP repository variable names one
      # (e.g. /Applications/Xcode_27.0.app).
      - name: Select Xcode
        env:
          XCODE_APP: ${{ vars.XCODE_APP }}
        run: |
          xcode="$XCODE_APP"
          [ -n "$xcode" ] || xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      # Server tests (Postgres, MySQL, MariaDB, SSH) skip without their MOONROW_TEST_* variables.
      - name: Test
        run: swift test

      - name: Bundle the app
        run: scripts/build-app.sh debug
