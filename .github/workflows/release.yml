name: Release

# Pushing a tag like v1.2.0 builds, packages and drafts a GitHub release; publishing the draft
# on GitHub releases it, and only then does the update feed offer it. A tag with a hyphen
# (v1.2.0-rc.1) drafts a prerelease. Running the workflow by hand builds and packages without
# a release; the files are kept as a workflow artifact.
#
# Signing and notarization are optional. With these set, the app is signed with a Developer ID
# and notarized; without them it is signed ad hoc:
#   secret MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
#   secret MACOS_CERTIFICATE_PASSWORD  its password
#   secret NOTARY_KEY                  base64 of an App Store Connect API key (.p8)
#   variables NOTARY_KEY_ID, NOTARY_ISSUER_ID  that key's ID and issuer
#
# Updates: secret SPARKLE_PRIVATE_KEY, the EdDSA key from Sparkle's `generate_keys -x`, signs the
# zip for appcast.xml, the feed the app reads from the latest release. Tags need it; a manual run
# without it skips the appcast. The feed carries the release notes from docs/release-notes, which
# a tag needs too.
#
# The secrets belong to the `release` environment, which only `v*` tags and `main` can use.
# A tag must be on main, and CodeQL scans it while it builds; the draft waits for both.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag is scanned by CodeQL while it builds, and drafted only if both pass (publish, below).
  scan-swift:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/codeql-swift.yml
    permissions:
      contents: read
      security-events: write

  scan-actions:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  build:
    runs-on: macos-26
    environment: release
    permissions:
      contents: read
      attestations: read
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: On main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main" >&2
            exit 1
          fi

      - name: Select Xcode
        env:
          XCODE_APP: ${{ vars.XCODE_APP }}
        run: |
          xcode="$XCODE_APP"
          [ -n "$xcode" ] || xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      # Before the build, so a tag without notes fails at once. A prerelease (1.2.0-rc.1) uses its
      # release's notes; a manual run renders the newest ones. Images come from this commit.
      - name: Release notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            notes="docs/release-notes/${VERSION%%-*}.md"
          else
            notes="$(ls docs/release-notes/[0-9]*.md | sort -V | tail -1)"
          fi
          if [ ! -f "$notes" ]; then
            echo "::error::No release notes; write docs/release-notes/${VERSION%%-*}.md" >&2
            exit 1
          fi
          mkdir -p build
          swift scripts/render-release-notes.swift "$notes" \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/docs/release-notes/" \
            > build/release-notes.html

      - name: Test
        run: swift test

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -t cert \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application: [^"]*)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "MOONROW_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare the notary key
        if: env.NOTARY_KEY != '' && env.MACOS_CERTIFICATE != ''
        run: |
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # The client tools Backup and Restore run: the Backup tools workflow's archive for this
      # version of the script, checked with gh attestation verify, or else built from source (long).
      - name: Backup tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-tools.sh

      - name: Build
        env:
          MOONROW_UNIVERSAL: '1'
        run: MOONROW_VERSION="$VERSION" MOONROW_BUILD="$GITHUB_RUN_NUMBER" scripts/build-app.sh release

      - name: Package
        run: scripts/package-release.sh "$VERSION"

      - name: Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The SPARKLE_PRIVATE_KEY secret isn't set" >&2
              exit 1
            fi
            echo "::warning::The SPARKLE_PRIVATE_KEY secret isn't set; no appcast.xml"
            exit 0
          fi
          scripts/make-appcast.sh "$VERSION" "$GITHUB_RUN_NUMBER" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Moonrow-$VERSION.zip" \
            build/release-notes.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Moonrow-${{ env.VERSION }}
          path: |
            build/release/
            build/release-notes.html

      - name: Remove the signing keychain
        if: always() && env.MACOS_CERTIFICATE != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # A draft: nothing reaches users until someone checks it and publishes it on GitHub. It's made
  # only when the build and both scans passed, and the tag has no serious code scanning alerts.
  publish:
    if: github.ref_type == 'tag'
    needs: [scan-swift, scan-actions, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check code scanning
        run: scripts/check-release-scan.sh "$GITHUB_REF" "$GITHUB_SHA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Moonrow-${{ env.VERSION }}
          path: build

      - name: Draft the release
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --title "Moonrow $VERSION" --generate-notes $flags \
            build/release/Moonrow-"$VERSION".dmg build/release/Moonrow-"$VERSION".zip build/release/SHA256SUMS \
            build/release/appcast.xml
